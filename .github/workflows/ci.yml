name: CI Workflow

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Ensure test directories exist
        run: |
          mkdir -p logs tasks
        shell: bash

      - name: 1. Syntax & Critical Error Check
        run: |
          python -m compileall .
          # Stop build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82
        shell: bash

      - name: 2. Test Task Manager CLI
        run: |
          python -m tasks.manage list
          python -m tasks.manage list --deep
          python -m tasks.manage add "CI Pipeline Test Task" --tag test --force
          python -m tasks.manage add "CI Deep Task" --tag code --deep --force
          python -m tasks.manage edit 1 "CI Updated Task" --tag updated
          python -m tasks.manage delete 1
        shell: bash

      - name: 3. Test Debug Script Actions
        run: |
          python debug.py --headless
          python debug.py --done --type 5min --headless
          python debug.py --skip --type 1hr --headless
        shell: bash
