name: CI Workflow

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: 1. Lint and Syntax Check (All Files)
        run: |
          python -m compileall .
          ruff check .
        shell: bash

      - name: 2. Test Task Manager CLI (All Subcommands)
        run: |
          # List initial tasks
          python -m tasks.manage list
          python -m tasks.manage list --deep

          # Add quick task & deep task
          python -m tasks.manage add "CI Pipeline Test Task" --tag test --force
          python -m tasks.manage add "CI Deep Pipeline Task" --tag code --deep --force

          # Edit task
          python -m tasks.manage edit 1 "CI Updated Task Text" --tag updated

          # Delete task
          python -m tasks.manage delete 1
        shell: bash

      - name: 3. Test Debug Runner & State Actions
        run: |
          # Standard execution
          python debug.py --headless

          # Trigger 'done' action on 5min log
          python debug.py --done --type 5min --headless

          # Trigger 'skip' action on 1hr log
          python debug.py --skip --type 1hr --headless
        shell: bash

      - name: 4. Run Pytest Suite (If test files exist)
        run: |
          if [ -d "tests" ]; then pytest -v; fi
        shell: bash
